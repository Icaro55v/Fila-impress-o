<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gestor de Fila</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 md:p-10 rounded-xl shadow-2xl max-w-md w-full">
        
        <div class="flex justify-center mb-6">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16 text-green-700" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4.5 12a7.5 7.5 0 0 0 15 0"/></svg>
        </div>
        
        <h2 id="form-title" class="text-3xl font-bold text-center text-gray-800 mb-6">Entrar</h2>

        <form id="auth-form" class="space-y-5">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" name="email" required 
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" name="password" required minlength="6"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500">
            </div>

            <p id="error-message" class="text-red-500 text-sm h-5"></p>

            <button type="submit" id="submit-btn" 
                    class="w-full bg-green-700 text-white py-3 rounded-lg font-semibold hover:bg-green-800 transition-colors">
                Entrar
            </button>
        </form>

        <p class="text-center text-sm text-gray-600 mt-6">
            <a href="#" id="toggle-form-link" class="text-green-600 hover:underline">Não tem conta? Criar nova conta</a>
        </p>
    </div>

    <!-- Firebase (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            const firebaseConfig = {
              apiKey: "AIzaSyD1k7xHT1gJj71cX6IQIgsZxYSoFrQuz9Q",
              authDomain: "stockmind-ai-lite.firebaseapp.com",
              databaseURL: "https://stockmind-ai-lite-default-rtdb.firebaseio.com",
              projectId: "stockmind-ai-lite",
              storageBucket: "stockmind-ai-lite.firebasestorage.app",
              messagingSenderId: "120136368220",
              appId: "1:120136368220:web:c6d547fb48d6f5aa71e699"
            };

            const appId = firebaseConfig.projectId;
            const app = firebase.initializeApp(firebaseConfig);
            const auth = firebase.auth();
            const db = firebase.database();

            // Elementos do DOM
            const authForm = document.getElementById('auth-form');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const errorMessage = document.getElementById('error-message');
            const submitBtn = document.getElementById('submit-btn');
            const toggleFormLink = document.getElementById('toggle-form-link');
            const formTitle = document.getElementById('form-title');

            let isLoginMode = true;

            // Mudar entre Login e Criar Conta
            toggleFormLink.addEventListener('click', (e) => {
                e.preventDefault();
                isLoginMode = !isLoginMode;
                if (isLoginMode) {
                    formTitle.textContent = 'Entrar';
                    submitBtn.textContent = 'Entrar';
                    toggleFormLink.textContent = 'Não tem conta? Criar nova conta';
                } else {
                    formTitle.textContent = 'Criar Nova Conta';
                    submitBtn.textContent = 'Criar Conta';
                    toggleFormLink.textContent = 'Já tem conta? Entrar';
                }
                errorMessage.textContent = '';
            });

            // Envio do formulário
            authForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = emailInput.value;
                const password = passwordInput.value;

                errorMessage.textContent = '';
                submitBtn.disabled = true;

                try {
                    if (isLoginMode) {
                        // --- Modo Login ---
                        await auth.signInWithEmailAndPassword(email, password);
                        // O onAuthStateChanged (no outro ficheiro) tratará do redirecionamento
                    } else {
                        // --- Modo Criar Conta ---
                        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                        const user = userCredential.user;

                        // *** MUDANÇA IMPORTANTE AQUI ***
                        // Define a 'role' do novo utilizador como 'admin'
                        const userRoleRef = db.ref(`/artifacts/${appId}/users/${user.uid}`);
                        await userRoleRef.set({
                            email: user.email,
                            role: 'admin' // <-- AQUI ESTÁ A MUDANÇA
                        });
                        
                        // O onAuthStateChanged (no outro ficheiro) tratará do redirecionamento
                    }
                    // Se chegar aqui, o login/criação foi bem-sucedido
                    window.location.replace('print_queue_manager.html');

                } catch (error) {
                    errorMessage.textContent = getFirebaseErrorMessage(error.code);
                    submitBtn.disabled = false;
                }
            });

            function getFirebaseErrorMessage(code) {
                switch (code) {
                    case 'auth/wrong-password':
                        return 'Password incorreta. Tente novamente.';
                    case 'auth/user-not-found':
                        return 'Nenhum utilizador encontrado com este email.';
                    case 'auth/email-already-in-use':
                        return 'Este email já está a ser utilizado.';
                    case 'auth/weak-password':
                        return 'A password deve ter pelo menos 6 caracteres.';
                    case 'auth/invalid-email':
                        return 'Formato de email inválido.';
                    default:
                        return 'Ocorreu um erro. Tente novamente.';
                }
            }
        });
    </script>
</body>
</html>
