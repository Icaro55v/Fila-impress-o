        // --- Lógica do Firebase ---

        /** Inicializa o Firebase e a autenticação */
        async function initializeFirebase() {
            if (!firebaseConfig.apiKey) {
                authError.innerText = "Erro: Configuração do Firebase está faltando.";
                authError.classList.remove('hidden');
                console.error("Configuração do Firebase incompleta.");
                return;
            }
            
            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                setLogLevel('Debug'); // Para logs detalhados no console

                // Listener principal de autenticação
                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        // ##### USUÁRIO ESTÁ LOGADO #####
                        console.log("Usuário autenticado:", user.uid);
                        currentUserId = user.uid;
                        userInfo.innerText = user.email;

                        // Buscar a função (role) do usuário
                        await fetchUserRole(user.uid);

                        // Mostrar a aplicação e esconder o login
                        appView.classList.remove('hidden');
                        loginView.classList.add('hidden');

                    } else {
                        // ##### USUÁRIO ESTÁ DESLOGADO #####
                        console.log("Nenhum usuário logado.");
                        currentUserId = null;
                        currentUserRole = null;

                        // Mostrar o login e esconder a aplicação
                        appView.classList.add('hidden');
                        loginView.classList.remove('hidden');
                        queueContainer.classList.add('hidden'); // Esconde painel admin

                        // Limpa o listener de jobs se existir
                        if (unsubscribeFromJobs) {
                            unsubscribeFromJobs();
                            unsubscribeFromJobs = null;
                        }
                    }
                });

            } catch (e) {
                console.error("Erro ao inicializar o Firebase:", e);
                authError.innerText = "Erro ao conectar com o Firebase.";
                authError.classList.remove('hidden');
            }
        }

                if (docSnap.exists() && docSnap.data().role === 'admin') {
                    console.log("Função: Admin");
                    currentUserRole = 'admin';
                    queueContainer.classList.remove('hidden'); // Mostra o painel do admin
                    attachJobsListener(); // Admins podem ver a fila
                } else {

                console.error("Erro ao buscar função do usuário:", error);
                currentUserRole = 'user'; // Assume 'user' em caso de erro
                queueContainer.classList.add('hidden');
            }
        }

        // --- NOVOS Handlers de Autenticação ---

        /** Manipula o Login */
        async function handleLogin(e) {
            e.preventDefault();
            loginButton.disabled = true;
            loginButton.innerText = "Entrando...";
            authError.classList.add('hidden');

            const email = loginForm.email.value;
            const password = loginForm.password.value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                // onAuthStateChanged cuidará do resto
            } catch (error) {
                console.error("Erro de login:", error.code);
                authError.innerText = getAuthErrorMessage(error.code);
                authError.classList.remove('hidden');
            } finally {
                loginButton.disabled = false;
                loginButton.innerText = "Entrar";
            }
        }

        /** Manipula o Registro */
        async function handleRegister(e) {
            e.preventDefault();
            registerButton.disabled = true;
            registerButton.innerText = "Registrando...";
            authError.classList.add('hidden');

            const email = registerForm.email.value;
            const password = registerForm.password.value;

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // ** IMPORTANTE: Cria o documento de função (role) para o novo usuário **
                // Todo novo usuário é 'user' por padrão
                const userDocRef = doc(db, USERS_COLLECTION_PATH, user.uid);
                await setDoc(userDocRef, {
                    email: user.email,
                    role: 'user' 
                });
                
                // onAuthStateChanged cuidará do resto
            } catch (error) {

                authError.classList.remove('hidden');
            } finally {

                registerButton.innerText = "Criar Conta";
            }
        }

        /** Traduz códigos de erro do Firebase */
        function getAuthErrorMessage(code) {
            switch (code) {
                case 'auth/invalid-email':
                    return 'Email inválido.';
                case 'auth/user-not-found':
                    return 'Usuário não encontrado.';
                case 'auth/wrong-password':

                case 'auth/weak-password':
                    return 'A senha deve ter pelo menos 6 caracteres.';
                default:
                    return 'Ocorreu um erro. Tente novamente.';
            }
        }
