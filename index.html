<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Fila de Impressão 3D</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Sortable.js (Drag and Drop) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <!-- DOMPurify (Segurança) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <!-- Fonte -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .sortable-ghost { opacity: 0.3; background: #dbeafe; border: 2px dashed #60a5fa; }
        .sortable-chosen { cursor: grabbing; opacity: 0.9; transform: scale(1.02); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .kanban-column-body { max-height: 75vh; overflow-y: auto; }
        /* Estilo para o seletor de cor */
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 0.375rem; }
    </style>
</head>
<body class="antialiased text-gray-900">

<!-- Cabeçalho -->
<header class="bg-green-800 text-white shadow-lg sticky top-0 z-40">
    <div class="container mx-auto max-w-full px-4 md:px-8 py-4 flex justify-between items-center">
        <!-- Logo e Título -->
        <div class="flex items-center space-x-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-green-300" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4.5 12a7.5 7.5 0 0 0 15 0"/></svg>
            <div class="flex items-center space-x-3">
                <div>
                    <h1 class="text-2xl font-bold">Gestor de Fila de Impressão 3D</h1>
                    <p class="text-sm text-gray-200 font-light">Gestão de Pedidos</p>
                </div>
            </div>
        </div>
        <!-- Botões de Ação -->
        <div class="flex items-center space-x-3">
            <!-- MUDANÇA: 'Ordenar por' é apenas para Admins, será mostrado/oculto via JS -->
            <div id="admin-controls" class="flex items-center space-x-3 hidden">
                <div class="flex items-center space-x-2 mr-2">
                    <label for="header-sort-select" class="text-sm font-medium">Ordenar por:</label>
                    <select id="header-sort-select" class="px-3 py-2 rounded-lg bg-white text-gray-800 text-sm border border-green-600">
                        <option value="createdAt" selected>Data de Adição</option>
                        <option value="priority">Prioridade (Admin)</option>
                    </select>
                </div>
            </div>
            <button id="add-task-btn" class="bg-green-600 hover:bg-green-700 px-5 py-2 rounded-lg font-semibold transition-colors">Adicionar Pedido</button>
            <button id="logout-btn" class="bg-green-500 text-white px-3 py-2 rounded-lg border border-green-600 text-sm font-medium hover:bg-red-600 hover:border-red-700 transition-colors">Sair</button>
        </div>
    </div>
</header>

<!-- Barra de Status da Autenticação -->
<div id="auth-status" class="py-2 px-6 bg-green-900 text-green-200 text-sm text-center sticky top-[80px] z-30">A conectar...</div>

<!-- Corpo Principal do Kanban -->
<!-- MUDANÇA: Colunas atualizadas para o fluxo de Impressão 3D -->
<main id="kanban-board" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 p-6">
    
    <!-- Coluna 1: Pendente -->
    <div class="kanban-column bg-white rounded-xl shadow-lg flex flex-col">
        <div class="p-4 border-b border-gray-200 flex justify-between items-center sticky top-[124px] bg-white rounded-t-xl z-10">
            <div class="flex items-center space-x-3">
                <span class="w-3 h-3 bg-red-500 rounded-full"></span>
                <h3 class="font-semibold text-red-600 uppercase text-sm">PENDENTE</h3>
            </div>
            <span id="count-pendente" class="px-2.5 py-0.5 bg-gray-200 text-gray-700 rounded-full font-semibold text-xs">0</span>
        </div>
        <div id="col-pendente" class="p-4 space-y-4 kanban-column-body flex-grow min-h-[200px]" data-column-id="pendente"></div>
    </div>

    <!-- Coluna 2: Em Andamento -->
    <div class="kanban-column bg-white rounded-xl shadow-lg flex flex-col">
        <div class="p-4 border-b border-gray-200 flex justify-between items-center sticky top-[124px] bg-white rounded-t-xl z-10">
            <div class="flex items-center space-x-3">
                <span class="w-3 h-3 bg-blue-500 rounded-full"></span>
                <h3 class="font-semibold text-blue-600 uppercase text-sm">EM ANDAMENTO</h3>
            </div>
            <span id="count-andamento" class="px-2.5 py-0.5 bg-gray-200 text-gray-700 rounded-full font-semibold text-xs">0</span>
        </div>
        <div id="col-andamento" class="p-4 space-y-4 kanban-column-body flex-grow min-h-[200px]" data-column-id="andamento"></div>
    </div>

    <!-- Coluna 3: Concluído -->
    <div class="kanban-column bg-white rounded-xl shadow-lg flex flex-col">
        <div class="p-4 border-b border-gray-200 flex justify-between items-center sticky top-[124px] bg-white rounded-t-xl z-10">
            <div class="flex items-center space-x-3">
                <span class="w-3 h-3 bg-green-500 rounded-full"></span>
                <h3 class="font-semibold text-green-600 uppercase text-sm">CONCLUÍDO</h3>
            </div>
            <span id="count-concluido" class="px-2.5 py-0.5 bg-gray-200 text-gray-700 rounded-full font-semibold text-xs">0</span>
        </div>
        <div id="col-concluido" class="p-4 space-y-4 kanban-column-body flex-grow min-h-[200px]" data-column-id="concluido"></div>
    </div>

    <!-- Coluna 4: Falha / Cancelado -->
    <div class="kanban-column bg-white rounded-xl shadow-lg flex flex-col">
        <div class="p-4 border-b border-gray-200 flex justify-between items-center sticky top-[124px] bg-white rounded-t-xl z-10">
            <div class="flex items-center space-x-3">
                <span class="w-3 h-3 bg-gray-500 rounded-full"></span>
                <h3 class="font-semibold text-gray-600 uppercase text-sm">FALHA / CANCELADO</h3>
            </div>
            <span id="count-falha" class="px-2.5 py-0.5 bg-gray-200 text-gray-700 rounded-full font-semibold text-xs">0</span>
        </div>
        <div id="col-falha" class="p-4 space-y-4 kanban-column-body flex-grow min-h-[200px]" data-column-id="falha"></div>
    </div>
</main>

<!-- MUDANÇA: Modal atualizado com o formulário detalhado -->
<div id="task-modal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 p-4 hidden">
    <div class="bg-white rounded-lg shadow-2xl max-w-2xl w-full transform scale-95 opacity-0 overflow-hidden" id="task-modal-content">
        <form id="task-form">

                        <div>
                            <label for="solicitante-nome" class="block text-sm font-medium text-gray-700 mb-1">Nome <span class="text-red-500">*</span></label>
                            <input type="text" id="solicitante-nome" class="w-full px-4 py-2 border border-gray-300 rounded-lg" required>
                        </div>

                            <label for="solicitante-matricula" class="block text-sm font-medium text-gray-700 mb-1">Matrícula <span class="text-red-500">*</span></label>
                            <input type="text" id="solicitante-matricula" class="w-full px-4 py-2 border border-gray-300 rounded-lg" required>
                        </div>
                        <div>
                            <label for="solicitante-area" class="block text-sm font-medium text-gray-700 mb-1">Área <span class="text-red-500">*</span></label>
                            <select id="solicitante-area" class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white" required>
                                <option value="" disabled selected>Selecione uma área</option>
                                <option value="Envase">Envase</option>
                                <option value="Processos">Processos</option>
                                <option value="Utilidades">Utilidades</option>

                        </div>
                        <div>
                            <label for="solicitante-email" class="block text-sm font-medium text-gray-700 mb-1">Email de Contato <span class="text-red-500">*</span></label>

                <!-- Seção da Peça -->
                <fieldset>
                    <legend class="text-lg font-semibold text-gray-700 border-b pb-2 mb-4 w-full">Detalhes da Peça</legend>
                     <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>

                            <select id="peca-nome" class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white" required>

                                <option value="Tampão">Tampão</option>
                                <option value="Chave para área de Processos">Chave para área de Processos</option>
                                <option value="Hélice">Hélice</option>
                                <option value="Tampa do Lava Olhos">Tampa do Lava Olhos</option>
                                <option value="Tampa do Lava Olhos - Linha de Chopp">Tampa do Lava Olhos - Linha de Chopp</option>
                                <option value="Pino identificador da abertura da válvula on-off">Pino identificador da abertura da válvula on-off</option>
                                <option value="Outra">Outra</option>
                            </select>
                        </div>
                        <div>

                        </div>
                        <div>
                            <label for="peca-codigo" class="block text-sm font-medium text-gray-700 mb-1">Código do Fabricante (Original)</label>
                            <input type="text" id="peca-codigo" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                        </div>
                        <div>
                            <label for="peca-equipamento" class="block text-sm font-medium text-gray-700 mb-1">Equipamento onde será usada</label>
                            <input type="text" id="peca-equipamento" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                        </div>
                    </div>
                </fieldset>

                <!-- Seção do Admin (Impressão) -->
                <fieldset id="admin-fields" class="hidden">
                    <legend class="text-lg font-semibold text-indigo-700 border-b border-indigo-200 pb-2 mb-4 w-full">Controlo de Impressão (Admin)</legend>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label for="admin-prioridade" class="block text-sm font-medium text-gray-700 mb-1">Prioridade</label>
                            <select id="admin-prioridade" class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white">
                                <option value="3">Baixa</option>
                                <option value="2" selected>Média</option>
                                <option value="1">Alta</option>
                            </select>
                        </div>
                        <div>
                            <label for="admin-material" class="block text-sm font-medium text-gray-700 mb-1">Material</label>
                            <select id="admin-material" class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white">
                                <option value="PLA">PLA</option>
                                <option value="PETG" selected>PETG</option>
                                <option value="ABS">ABS</option>
                                <option value="TPU">TPU</option>
                                <option value="Outro">Outro</option>
                            </select>
                        </div>
                        <div>
                            <label for="admin-cor" class="block text-sm font-medium text-gray-700 mb-1">Cor</label>
                            <input type="color" id="admin-cor" value="#4F46E5" class="w-full h-10 p-0 border border-gray-300 rounded-lg cursor-pointer">
                        </div>
                    </div>
                    <div class="mt-4">
                        <label for="admin-ficheiro" class="block text-sm font-medium text-gray-700 mb-1">Nome do Ficheiro (.stl, .3mf)</label>
                        <input type="text" id="admin-ficheiro" placeholder="ex: peca_final_v2.stl" class="w-full px-4 py-2 border border-gray-300 rounded-lg">

                </fieldset>

                <input type="hidden" id="task-id-hidden">
                <p id="modal-error-message" class="text-red-500 text-sm h-5"></p>
            </div>
            
            <div class="flex justify-end items-center space-x-4 p-5 bg-gray-50 rounded-b-lg">
                <button type="button" id="cancel-modal-btn" class="px-5 py-2 rounded-lg bg-gray-200 hover:bg-gray-300 transition-colors">Cancelar</button>
                <button type="submit" id="save-task-btn" class="px-6 py-2 rounded-lg bg-green-600 text-white hover:bg-green-700 transition-colors">Salvar</button>

<!-- Modal de Confirmação de Exclusão -->

    <div class="bg-white p-6 rounded-lg shadow-2xl max-w-sm w-full transform scale-95 opacity-0" id="delete-modal-content">
        <h4 class="text-xl font-semibold mb-4">Confirmar exclusão</h4>

<!--
    ! IMPORTANTE!
    Usamos as versões -compat para compatibilidade com a sintaxe estilo v8.
-->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {
    
    // --- 1. CONFIGURAÇÃO DO FIREBASE ---
    const firebaseConfig = {
      apiKey: "AIzaSyD1k7xHT1gJj71cX6IQIgsZxYSoFrQuz9Q",
      authDomain: "stockmind-ai-lite.firebaseapp.com",
      databaseURL: "https://stockmind-ai-lite-default-rtdb.firebaseio.com",
      projectId: "stockmind-ai-lite",
      storageBucket: "stockmind-ai-lite.firebasestorage.app",
      messagingSenderId: "120136368220",
      appId: "1:120136368220:web:c6d547fb48d6f5aa71e699"
    };

    const appId = firebaseConfig.projectId;
    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // --- 2. VARIÁVEIS GLOBAIS E ESTADO ---
    let currentUser = null;
    let userUid = null;
    let userRole = 'user'; // Padrão é 'user'
    let dbTasksRef = null; 
    let taskToDeleteId = null;
    let allTasks = {}; // Cache local de todas as tarefas
    let sortables = []; // Array para guardar instâncias do Sortable

    // --- 3. MAPEAMENTO DE ELEMENTOS DO DOM ---
    const authStatus = document.getElementById('auth-status');
    const logoutBtn = document.getElementById('logout-btn');
    const addTaskBtn = document.getElementById('add-task-btn');
    const adminControls = document.getElementById('admin-controls');
    const headerSortSelect = document.getElementById('header-sort-select');

    // MUDANÇA: Colunas de 4 status
    const columns = {
        "pendente": document.getElementById('col-pendente'),
        "andamento": document.getElementById('col-andamento'),
        "concluido": document.getElementById('col-concluido'),
        "falha": document.getElementById('col-falha')
    };
    const columnIds = Object.keys(columns);
    const columnCounts = {
        "pendente": document.getElementById('count-pendente'),
        "andamento": document.getElementById('count-andamento'),
        "concluido": document.getElementById('count-concluido'),
        "falha": document.getElementById('count-falha')
    };

    // Modais
    const taskModal = document.getElementById('task-modal');
    const taskModalContent = document.getElementById('task-modal-content');
    const taskForm = document.getElementById('task-form');
    const modalTitle = document.getElementById('modal-title');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const cancelModalBtn = document.getElementById('cancel-modal-btn');
    const saveTaskBtn = document.getElementById('save-task-btn');
    const taskIdHidden = document.getElementById('task-id-hidden');
    const modalErrorMessage = document.getElementById('modal-error-message');
    
    // Campos do Formulário (Usuário)
    const solicitanteNome = document.getElementById('solicitante-nome');
    const solicitanteMatricula = document.getElementById('solicitante-matricula');
    const solicitanteArea = document.getElementById('solicitante-area');
    const solicitanteEmail = document.getElementById('solicitante-email');
    const pecaNome = document.getElementById('peca-nome');
    const pecaOutra = document.getElementById('peca-outra');
    const pecaCodigo = document.getElementById('peca-codigo');
    const pecaEquipamento = document.getElementById('peca-equipamento');

    // Campos do Formulário (Admin)
    const adminFields = document.getElementById('admin-fields');
    const adminPrioridade = document.getElementById('admin-prioridade');
    const adminMaterial = document.getElementById('admin-material');
    const adminCor = document.getElementById('admin-cor');
    const adminFicheiro = document.getElementById('admin-ficheiro');
    
    const deleteModal = document.getElementById('delete-modal');
    const deleteModalContent = document.getElementById('delete-modal-content');
    const cancelDeleteBtn = document.getElementById('cancel-delete-btn');
    const confirmDeleteBtn = document.getElementById('confirm-delete-btn');


    // --- 4. LÓGICA DE AUTENTICAÇÃO E FUNÇÕES (ROLES) ---

    auth.onAuthStateChanged(user => {
        if (user) {
            currentUser = user;
            userUid = user.uid;
            const userName = user.email.split('@')[0];
            authStatus.textContent = `Conectado como: ${userName.charAt(0).toUpperCase() + userName.slice(1)}`;

            // Verifica a função (role) do utilizador
            const userRoleRef = db.ref(`/artifacts/${appId}/users/${user.uid}/role`);
            userRoleRef.on('value', (snap) => {
                if (snap.exists() && snap.val() === 'admin') {
                    userRole = 'admin';
                    authStatus.textContent += ' (ADMIN)';
                    adminControls.classList.remove('hidden');
                } else {
                    userRole = 'user';
                    authStatus.textContent += ' (Usuário)';
                    adminControls.classList.add('hidden');
                }
                
                // Inicializa os listeners e o drag-and-drop
                // (só depois de sabermos a função)
                initRealtimeListener();
                initSortable();
            });

        } else {
            currentUser = null;
            userUid = null;
            // CORREÇÃO 1: O redirecionamento deve usar './' para ser um caminho relativo válido
            window.location.replace('./login.html');
        }
    });

    logoutBtn.addEventListener('click', () => {
        // if (confirm('Deseja sair?')) { // 'confirm' é bloqueado
            auth.signOut();
        // }
    });

    // --- 5. LÓGICA DO BANCO DE DADOS (RTDB) ---

    function initRealtimeListener() {
        // Limpa listeners antigos se existirem
        if (dbTasksRef) dbTasksRef.off(); 
        
        columnIds.forEach(id => columns[id].innerHTML = '');
        allTasks = {};

        const publicTasksPath = `/artifacts/${appId}/public/data/allPrintJobs`;

        // Admin vê tudo, Usuário vê apenas os seus
        if (userRole === 'admin') {
            dbTasksRef = db.ref(publicTasksPath);
        } else {
            dbTasksRef = db.ref(publicTasksPath).orderByChild('createdBy').equalTo(userUid);
        }

        // --- Handlers ---
        const onChildAdded = (snap) => {
            const task = snap.val();
            const taskId = snap.key;
            if (!task) return;
            allTasks[taskId] = { id: taskId, ...task };
            renderAllTasks(); // Re-renderiza e re-ordena
        };

        const onChildChanged = (snap) => {
            const task = snap.val();
            const taskId = snap.key;
            if (!task) return;
            allTasks[taskId] = { id: taskId, ...task };
            renderAllTasks(); // Re-renderiza e re-ordena
        };

        const onChildRemoved = (snap) => {
            const taskId = snap.key;
            delete allTasks[taskId];
            renderAllTasks(); // Re-renderiza e re-ordena
        };

        // Registra os listeners
        dbTasksRef.on('child_added', onChildAdded);
        dbTasksRef.on('child_changed', onChildChanged);
        dbTasksRef.on('child_removed', onChildRemoved);
    }
    
    // --- 6. RENDERIZAÇÃO E ORDENAÇÃO ---

    headerSortSelect.addEventListener('change', renderAllTasks);

    function renderAllTasks() {
        // Limpa colunas
        columnIds.forEach(id => columns[id].innerHTML = '');

        let tasksArray = Object.values(allTasks);

        // Aplica Ordenação (Admin)
        const sortValue = headerSortSelect.value;
        if (userRole === 'admin' && sortValue === 'priority') {
            // Prioridade 1 (Alta) primeiro, depois 2, depois 3
            tasksArray.sort((a, b) => (a.adminPrioridade || 2) - (b.adminPrioridade || 2));
        } else {
            // Padrão: Data de criação (mais antigo primeiro)
            tasksArray.sort((a, b) => a.createdAt - b.createdAt);
        }

        // Renderiza nas colunas
        tasksArray.forEach(task => {
            const colId = task.status || 'pendente';
            if (columns[colId]) {
                const card = createTaskElement(task);
                columns[colId].appendChild(card);
            }
        });

        updateAllCounts();
    }

    function updateAllCounts() {
        columnIds.forEach(colId => {
            const count = columns[colId].children.length;
            columnCounts[colId].textContent = count;
        });
    }

    // Gerador de Classes de Prioridade (Admin)
    function getPriorityClasses(priority){
        priority = String(priority);
        if (priority === '1') return { border:'border-red-500', text:'Alta', bg:'bg-red-500' };
        if (priority === '2') return { border:'border-orange-500', text:'Média', bg:'bg-orange-500' };
        if (priority === '3') return { border:'border-blue-500', text:'Baixa', bg:'bg-blue-500' };
        return { border:'border-gray-400', text:'N/A', bg:'bg-gray-500' };
    }

    // Criação do Elemento Card
    function createTaskElement(task){
        // Usa a prioridade do admin se existir, senão N/A
        const p = getPriorityClasses(task.adminPrioridade);
        
        const card = document.createElement('div');
        card.className = `task-card bg-white p-4 rounded-lg shadow-md border-l-4 ${p.border} group relative`;
		card.dataset.taskId = task.id;
        
        // Define o cursor: 'move' para admin, 'default' para usuário
        card.style.cursor = (userRole === 'admin') ? 'move' : 'default';

        // Sanitização
        const peca = DOMPurify.sanitize(task.pecaNome === 'Outra' ? task.pecaOutra : task.pecaNome);
        const area = DOMPurify.sanitize(task.solicitanteArea);
        const nome = DOMPurify.sanitize(task.solicitanteNome);
        const data = new Date(task.createdAt).toLocaleDateString('pt-BR');

        card.innerHTML = `
            <!-- Título: Nome da Peça -->
            <h4 class="text-base font-semibold text-gray-800 mb-2">${peca}</h4>
            
            <!-- Detalhes -->
            <p class="text-sm text-gray-600"><span class="font-medium">Solicitante:</span> ${nome}</p>
            <p class="text-sm text-gray-600"><span class="font-medium">Área:</span> ${area}</p>
            
            <!-- Rodapé do Card -->
            <div class="flex justify-between items-center mt-3 pt-3 border-t border-gray-100">
                <span class="text-xs font-semibold px-2 py-0.5 rounded-full ${p.bg} text-white">${p.text}</span>
                <span class="text-xs text-gray-400">${data}</span>
            </div>
            
            <!-- Botão de Apagar (Só para Admin) -->
            <button class="delete-task-btn ${userRole === 'admin' ? '' : 'hidden'} absolute top-2 right-2 text-gray-400 hover:text-red-600 opacity-0 group-hover:opacity-100 transition-opacity" aria-label="Apagar Pedido">✕</button>
        `;
        
        // Admin pode editar (clique no card)
		if (userRole === 'admin') {
            card.addEventListener('click', () => openTaskModal('edit', card.dataset.taskId));
        }
        
        // Admin pode apagar (botão X)
        card.querySelector('.delete-task-btn').addEventListener('click', (e)=>{ 
            e.stopPropagation(); 
            showDeleteModal(card.dataset.taskId); 
        });
        
        return card;
    }

    // --- 7. LÓGICA DOS MODAIS ---

    function showModal(modal, content){ 
        modal.classList.remove('hidden'); 
        setTimeout(()=>{ 
            modal.classList.add('opacity-100'); 
            content.classList.add('scale-100','opacity-100'); 
            content.classList.remove('scale-95','opacity-0'); 
        }, 10);
    }

    function hideModal(modal, content){ 
        content.classList.remove('scale-100','opacity-100'); 
        content.classList.add('scale-95','opacity-0'); 
        modal.classList.remove('opacity-100'); 
        setTimeout(()=> modal.classList.add('hidden'), 200); 
    }
    
    // Controla o campo "Outra Peça"
    pecaNome.addEventListener('change', () => {
        pecaOutra.disabled = (pecaNome.value !== 'Outra');
        if (!pecaOutra.disabled) pecaOutra.focus();
    });

    // Abertura do Modal de Tarefa
    async function openTaskModal(mode = 'add', taskId = null){
        modalErrorMessage.textContent = '';
        taskForm.reset();
        // Garante que o campo 'outra' esteja desabilitado
        pecaOutra.disabled = true;
        saveTaskBtn.disabled = false;
        saveTaskBtn.textContent = "Salvar";

        // CORREÇÃO 2: Adiciona uma verificação para garantir que currentUser não é nulo
        // Isto previne o erro 'Cannot read properties of null (reading 'email')'
        if (!currentUser) {
            modalErrorMessage.textContent = "Erro: Utilizador não autenticado. Por favor, atualize a página.";
            saveTaskBtn.disabled = true;
            return; 
        }

        // Usuário comum NUNCA vê os campos de admin
        adminFields.classList.add('hidden');
        
        // Preenche campos do usuário (se estiver logado)
        solicitanteEmail.value = currentUser.email; // Esta linha agora é segura
        // (Idealmente, carregaria nome/matrícula do perfil, mas por enquanto deixa em branco)

        if (mode === 'add') {
            modalTitle.textContent = 'Adicionar Pedido';
            taskIdHidden.value = '';
        } 
        else if (mode === 'edit' && taskId && userRole === 'admin') {
            // Modo Edição (SÓ ADMIN)
            modalTitle.textContent = 'Editar Pedido';
            taskIdHidden.value = taskId; 
            
            // Mostra campos de admin
            adminFields.classList.remove('hidden');
            
            const task = allTasks[taskId];
            if (!task) {
                modalErrorMessage.textContent = "Erro: Tarefa não encontrada.";
                return;
            }

            // Preenche campos do usuário
            solicitanteNome.value = task.solicitanteNome || '';
            solicitanteMatricula.value = task.solicitanteMatricula || '';
            solicitanteArea.value = task.solicitanteArea || '';
            solicitanteEmail.value = task.solicitanteEmail || '';
            pecaNome.value = task.pecaNome || '';
            pecaOutra.value = task.pecaOutra || '';
            if (task.pecaNome === 'Outra') pecaOutra.disabled = false;
            pecaCodigo.value = task.pecaCodigo || '';
            pecaEquipamento.value = task.pecaEquipamento || '';
            
            // Preenche campos de admin
            adminPrioridade.value = task.adminPrioridade || '2';
            adminMaterial.value = task.adminMaterial || 'PETG';
            adminCor.value = task.adminCor || '#4F46E5';
            adminFicheiro.value = task.adminFicheiro || '';
        }
        
        showModal(taskModal, taskModalContent);
    }

    function closeTaskModal(){ 
        hideModal(taskModal, taskModalContent); 
    }

    function showDeleteModal(id){ 
        taskToDeleteId = id; 
        confirmDeleteBtn.disabled = false;
        showModal(deleteModal, deleteModalContent); 
    }

    function hideDeleteModal(){ 
        hideModal(deleteModal, deleteModalContent); 
        taskToDeleteId = null; 
    }

    // Evento de Envio do Formulário (Salvar)
    taskForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        modalErrorMessage.textContent = '';
        saveTaskBtn.disabled = true;
        saveTaskBtn.textContent = "A salvar...";

        const editingId = taskIdHidden.value; 
        
        // Recolhe dados do formulário
        const data = {
            // Usuário
            solicitanteNome: solicitanteNome.value,
            solicitanteMatricula: solicitanteMatricula.value,
            solicitanteArea: solicitanteArea.value,
            solicitanteEmail: solicitanteEmail.value,
            pecaNome: pecaNome.value,
            pecaOutra: pecaOutra.disabled ? '' : pecaOutra.value,
            pecaCodigo: pecaCodigo.value,
            pecaEquipamento: pecaEquipamento.value,
        };

        try {
            if (editingId && userRole === 'admin') {
                // --- MODO EDIÇÃO (ADMIN) ---
                // Adiciona os campos de admin
                data.adminPrioridade = adminPrioridade.value;
                data.adminMaterial = adminMaterial.value;
                data.adminCor = adminCor.value;
                data.adminFicheiro = adminFicheiro.value;
                
                await dbTasksRef.child(editingId).update(data);

            } else if (!editingId) {
                // --- MODO ADIÇÃO (QUALQUER UM) ---
                data.createdBy = userUid; // ID de quem criou
                data.createdAt = firebase.database.ServerValue.TIMESTAMP;
                data.status = 'pendente'; // Status inicial
                
                // Campos admin com valores padrão (invisíveis para o usuário)
                data.adminPrioridade = '2'; // Média
                data.adminMaterial = 'PETG';
                data.adminCor = '#4F46E5';
                data.adminFicheiro = '';

                const newRef = dbTasksRef.push();
                await newRef.set(data);
            }
            
            closeTaskModal();
            // O listener 'onChildChanged' ou 'onChildAdded' tratará da renderização

        } catch (err) {
             modalErrorMessage.textContent = 'Erro ao salvar: ' + err.message;
             saveTaskBtn.disabled = false;
             saveTaskBtn.textContent = "Salvar";
        }
    });

    // Evento de Exclusão (SÓ ADMIN)
    confirmDeleteBtn.addEventListener('click', async () => {
        if (taskToDeleteId && userRole === 'admin') {
            confirmDeleteBtn.disabled = true;
            try {
                await dbTasksRef.child(taskToDeleteId).remove();
                hideDeleteModal();
            } catch (err) {
                alert("Erro ao excluir: " + err.message);
                confirmDeleteBtn.disabled = false;
            }
        }
    });

    // Listeners de fechar modais
    cancelDeleteBtn.addEventListener('click', hideDeleteModal);
    closeModalBtn.addEventListener('click', closeTaskModal);
    cancelModalBtn.addEventListener('click', closeTaskModal);
    taskModal.addEventListener('click', (e) => { if (e.target === taskModal) closeTaskModal(); });
    deleteModal.addEventListener('click', (e) => { if (e.target === deleteModal) hideDeleteModal(); });
    addTaskBtn.addEventListener('click', () => openTaskModal('add'));

    // --- 8. INICIALIZAÇÃO DO DRAG & DROP (Sortable.js) ---

    function initSortable(){
        // Destrói instâncias antigas (importante ao trocar de usuário)
        sortables.forEach(s => s.destroy());
        sortables = [];
        
        columnIds.forEach(colId => {
            const el = columns[colId];
            if (!el) return;
            
            const s = new Sortable(el, {
                group: 'kanban',
                animation: 150,
                ghostClass: 'sortable-ghost',
                chosenClass: 'sortable-chosen',
                // MUDANÇA: Desabilita drag-and-drop se não for admin
                disabled: userRole !== 'admin',
                
                onEnd: (evt) => {
                    if (userRole !== 'admin') return; // Segurança extra

                    const taskId = evt.item.dataset.taskId;
                    const newCol = evt.to.dataset.columnId;
                    const oldCol = evt.from.dataset.columnId;

                    if (newCol === oldCol) return; 
                    
                    // Atualiza o status no banco de dados
                    dbTasksRef.child(taskId).update({ status: newCol })
                    .catch(err => {
                        alert("Erro ao mover card. Revertendo.");
                        evt.from.appendChild(evt.item);
                    });
                    
                    // A atualização visual será feita pelo listener 'onChildChanged'
                }
            });
            sortables.push(s); // Guarda a instância para destruir depois
        });
    }

});
</script>
